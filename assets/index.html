      <nav class="breadcrumb" aria-label="Breadcrumb" data-i18n-aria-label="Breadcrumb"></nav>

          <span class="transfers-title" data-i18n="Uploads">Uploads</span>
          <span class="transfers-status" id="transfers-status"></span>
        </div>
        <div class="transfers-progress" id="transfers-progress" role="progressbar" aria-label="Overall upload progress" data-i18n-aria-label="Overall upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="transfers-progress-fill" id="transfers-progress-fill"></div>

          <div class="transfers-failed hidden" id="transfers-failed"></div>
          <div class="transfers-queue hidden" id="transfers-queue">
            <button type="button" class="transfers-queue-toggle" id="transfers-queue-toggle" aria-expanded="false" aria-controls="transfers-queue-list">

              <span class="transfers-queue-label" id="transfers-queue-label"></span>
            </button>
            <div class="transfers-queue-list hidden" id="transfers-queue-list"></div>
          </div>
        </div>
      </div>

      <div class="viewbar">
        <p class="item-count" id="item-count" aria-live="polite"></p>
        <div class="grid-sort hidden" id="grid-sort"></div>
      </div>

      <div class="empty hidden" id="empty">
        <div class="empty-icon" id="empty-icon" aria-hidden="true"></div>
        <h1 class="empty-title" id="empty-title"></h1>
        <p class="empty-desc" id="empty-desc"></p>
        <button type="button" class="btn btn-primary hidden" id="empty-action"></button>
